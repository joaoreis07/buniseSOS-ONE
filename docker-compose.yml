services:
  postgres:
    image: postgres:16-alpine
    container_name: businessos-one-postgres
    restart: unless-stopped
    ports:
      # Finance=5432, Odonto=5433 (ocupada). One usa 5434 para coexistir sem conflito.
      - "5434:5432"
    environment:
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: businessos
      POSTGRES_DB: businessos_one
    volumes:
      - businessos_one_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos -d businessos_one"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  businessos_one_pg_data:
